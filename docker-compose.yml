version: "3.9"

services:
  backend:
    build: .
    container_name: backend
    ports:
      - "3000:3000"
    env_file:
    - .env
    restart: always

  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
